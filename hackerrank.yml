version: 1.0
install: bun install && bash setup.sh --seed
run: bun start
configuration:
  has_webserver: true
  readonly_paths:
    - backend/scripts/**
    - backend/calendar_backend/settings.py
    - frontend/vite.config.js
  ide_config:
    default_open_files:
      - backend/apps/gavel/views.py
      - frontend/src/features/gavel/GavelApp.jsx
    project_menu:
      run: bun start
      install: bun install && bash setup.sh --seed
